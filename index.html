<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>פתיחה באובסידיאן...</title>
<style>
  body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #1a1a2e; color: #e0e0e0; text-align: center; }
  .container { padding: 2rem; }
  h1 { font-size: 1.5rem; margin-bottom: 1rem; }
  .btn { display: inline-block; padding: 14px 28px; background: #7c3aed; color: white; text-decoration: none; border-radius: 12px; font-size: 1.1rem; margin-top: 1rem; }
  .btn:hover { background: #6d28d9; }
  .subtle { color: #888; font-size: 0.85rem; margin-top: 1.5rem; }
</style>
</head>
<body>
<div class="container">
  <h1>📂 פותח באובסידיאן...</h1>
  <p id="filename"></p>
  <a id="fallback-btn" class="btn" href="#">לחץ כאן אם לא נפתח</a>
  <p class="subtle">אם אובסידיאן לא מותקן, הלינק לא יעבוד</p>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const file = params.get('f') || '';
  const vault = params.get('v') || 'NEW OBSIDIAN';
  const uri = `obsidian://open?vault=${encodeURIComponent(vault)}&file=${encodeURIComponent(file)}`;

  document.getElementById('filename').textContent = file ? `קובץ: ${file}` : 'לא צוין קובץ';
  document.getElementById('fallback-btn').href = uri;

  if (file) {
    setTimeout(() => { window.location.href = uri; }, 300);
  }
</script>
</body>
</html>
