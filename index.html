<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>פתיחה באובסידיאן</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #1a1a2e; color: #e0e0e0; text-align: center; padding: 1rem; }
  .container { max-width: 400px; }
  .icon { font-size: 3rem; margin-bottom: 1rem; }
  h1 { font-size: 1.3rem; margin-bottom: 0.5rem; font-weight: 600; }
  .filename { color: #a78bfa; font-size: 1rem; margin-bottom: 1.5rem; direction: ltr; word-break: break-all; }
  .btn { display: block; width: 100%; padding: 16px 24px; background: #7c3aed; color: white; text-decoration: none; border-radius: 14px; font-size: 1.15rem; font-weight: 600; border: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .btn:active { background: #6d28d9; transform: scale(0.98); }
  .subtle { color: #666; font-size: 0.8rem; margin-top: 1.2rem; line-height: 1.4; }
  .status { color: #4ade80; font-size: 0.9rem; margin-top: 1rem; display: none; }
</style>
</head>
<body>
<div class="container">
  <div class="icon">📂</div>
  <h1>פתיחה באובסידיאן</h1>
  <p class="filename" id="filename"></p>
  <a id="open-btn" class="btn" href="#">פתח באובסידיאן</a>
  <p class="status" id="status">✅ נשלח לאובסידיאן</p>
  <p class="subtle">לוחצים על הכפתור → אובסידיאן נפתח עם הקובץ.<br>אם לא עובד — וודא שאובסידיאן מותקן.</p>
</div>
<script>
  const params = new URLSearchParams(window.location.search);
  const file = params.get('f') || '';
  const vault = params.get('v') || 'NEW OBSIDIAN';
  const uri = 'obsidian://open?vault=' + encodeURIComponent(vault) + '&file=' + encodeURIComponent(file);

  var fnEl = document.getElementById('filename');
  var btnEl = document.getElementById('open-btn');
  var statusEl = document.getElementById('status');

  if (file) {
    fnEl.textContent = file;
    btnEl.href = uri;
    btnEl.addEventListener('click', function(e) {
      e.preventDefault();
      window.location.href = uri;
      statusEl.style.display = 'block';
    });
  } else {
    fnEl.textContent = 'לא צוין קובץ';
    btnEl.style.background = '#555';
    btnEl.textContent = 'חסר פרמטר f=';
  }
</script>
</body>
</html>
